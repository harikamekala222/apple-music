
services:

  db:
    image: postgres:16-alpine
    container_name: apple-music-db
    restart: unless-stopped

    environment:
      POSTGRES_USER: musicuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: musicdb

    volumes:
      - music_db_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U musicuser -d musicdb"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - music-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: apple-music-backend
    restart: unless-stopped

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    expose:
      - "8000"

    networks:
      - music-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api

    container_name: apple-music-frontend
    restart: unless-stopped

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - music-network

volumes:
  music_db_data:

networks:
  music-network:
    driver: bridge
